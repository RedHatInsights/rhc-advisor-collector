upstream_package_name: rhc-advisor-collector
downstream_package_name: rhc-advisor-collector
specfile_path: rhc-advisor-collector.spec

srpm_build_deps:
  - make
  - git

actions:
  create-archive:
    - bash -c 'make dist'
    - bash -c 'echo dist/rhc-advisor-collector-*.tar.gz'
  # Tells packit what version this build is.
  # Exposed back to fix-spec-file below as $PACKIT_RPMSPEC_VERSION.
  get-current-version:
    - bash -c 'make -s print-version'
  fix-spec-file:
    - bash -c "sed -i -E \"s/^Version:([[:space:]]*)[^[:space:]]+/Version:\1${PACKIT_RPMSPEC_VERSION}/\" rhc-advisor-collector.spec"
    - bash -c "sed -i -E \"s/^Release:([[:space:]]*)[^[:space:]]+/Release:\1${PACKIT_RPMSPEC_RELEASE}%{?dist}/\" rhc-advisor-collector.spec"

jobs:
  - &copr_job
    job: copr_build
    trigger: pull_request
    targets:
      - rhel-10-x86_64

  - <<: *copr_job
    trigger: release
